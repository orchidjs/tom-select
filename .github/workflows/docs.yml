name: Publish docs to GitHub pages

on:
  push:
    branches:
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js
        # https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
      - name: Build assets
        run: npm run build
      - name: Build docs
        run: npm run build:docs

      - name: Setup Pages
        # https://github.com/actions/configure-pages/releases/tag/v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload artifact
        # https://github.com/actions/upload-pages-artifact/releases/tag/v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: './build-docs'
      - name: Deploy to GitHub Pages
        id: deployment
        # https://github.com/actions/deploy-pages/releases/tag/v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
